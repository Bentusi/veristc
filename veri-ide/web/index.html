<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VeriIDE</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="128x128" href="/favicon-128x128.png" />
    <link rel="apple-touch-icon" href="/favicon-128x128.png" />
    <script>
      // Before first paint: a light-theme user must not see a dark frame.
      document.documentElement.dataset.theme =
        localStorage.getItem("veride.theme") === "light" ? "light" : "dark";
    </script>
  </head>
  <body class="bg-ide-bg text-ide-text overflow-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
